name: Linter

run-name: Is this real ?

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  linter:
    name: "Linter ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"
    runs-on: docker
    container: node:lts-alpine3.23@sha256:e6c03d42b46af3b1e98207e59f06a43cfe5efd3ec4b4d3d9802bddf04f833374
    steps:
      - name: Install Deps
        run: |
          apk add \
            git \
            jq \
            curl

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install app
        run: npm ci

      ## PRETTIER
      - name: Run Prettier
        id: prettier_check
        continue-on-error: true
        run: npm run format:check

      - name: Fix formatting
        if: steps.prettier_check.outcome == 'failure'
        run: |
          npm run format
          git diff > prettier.patch
          git reset HEAD --hard

      - name: Upload Prettier patch
        if: steps.prettier_check.outcome == 'failure'
        uses: https://data.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: prettier-patch
          path: prettier.patch

      ## ES-LINT
      - name: EsLint
        id: eslint_check
        continue-on-error: true
        run: npm run lint

      - name: Fix ESLint
        if: steps.eslint_check.outcome == 'failure'
        continue-on-error: true
        run: npm run lint:fix:dry-run

      - name: Upload ESLint errors
        if: steps.eslint_check.outcome == 'failure'
        uses: https://data.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: lint-fix
          path: lint-fix.json

      ## SVELTE CHECK
      - name: Run Svelte check
        id: svelte_check
        continue-on-error: true
        run: npm run check

      # Force failed
      - name: Fail if checks failed
        if: |
          steps.prettier_check.outcome == 'failure' ||
          steps.eslint_check.outcome == 'failure' ||
          steps.svelte_check.outcome == 'failure'
        run: |
          echo "Quality checks failed"
          exit 1
