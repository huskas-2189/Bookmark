name: Gitleaks

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: docker
    container: node:lts-alpine3.23@sha256:595398b0081eacda8e1c4c5b97b76cd1020e4d58a8ebcb4843b9bca1e79e7436
    steps:
      - name: Install deps
        run: |
          apk add --no-cache \
            git \
            curl \
            tar

      - name: Install Gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          mv gitleaks /usr/local/bin/gitleaks

      - name: Checkout
        uses: actions/checkout@v7

      - name: run Gitleaks
        id: gitleaks_run
        continue-on-error: true
        run: |
          gitleaks dir . --report-format csv --report-path gitleaks-report.csv

      - name: Upload Gitleaks result
        if: steps.gitleaks.outcome == 'failure'
        uses: https://data.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: Gitleaks Report
          path: gitleaks-report.csv

      - name: Fail if secrets found
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "Gitleaks detected one or more potential secrets. See the uploaded report."
          exit 1
